<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAR Capture Suite — Remote</title>
    <script>
      // Web shim: replicate Electron preload API (window.harSuite)
      (function () {
        const API = location.origin;
        const WS_URL = API.replace(/^http/, 'ws') + '/ws';
        const listeners = {};
        function on(e, cb) { (listeners[e] = listeners[e] || []).push(cb); }
        function off(e, cb) { if (listeners[e]) listeners[e] = listeners[e].filter(f => f !== cb); }
        function emit(e, d) { for (const f of listeners[e] || []) f(d); }

        let ws;
        function connectWs() {
          ws = new WebSocket(WS_URL);
          ws.onmessage = (e) => {
            try {
              const m = JSON.parse(e.data);
              if (m.type === 'request') emit('capture:request', m.request);
              else if (m.type === 'update') emit('capture:update', m);
              else if (m.type === 'ws-message') emit('capture:ws-message', m);
              else if (m.type === 'status') emit('capture:status', m);
              else if (m.type === 'connection') emit('capture:connection', m);
              else if (m.type === 'cleared') emit('capture:cleared', m);
              else if (m.type === 'reloaded') emit('capture:reloaded', m);
              else if (m.type === 'captcha') emit('capture:captcha', m);
              else if (m.type === 'cookie-snapshot' || m.type === 'set-cookie-capture') emit('capture:cookie', m);
            } catch {}
          };
          ws.onclose = () => setTimeout(connectWs, 2000);
          ws.onerror = () => { try { ws.close(); } catch {} };
        }
        connectWs();

        async function api(path, opts) {
          const r = await fetch(API + path, opts);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }

        const stub = (val) => () => Promise.resolve(val);
        const STUB_APP = { enabled: false, port: 0, proxyActive: false, supported: false };
        const STUB_CLI = { proxyRunning: false, globalEnvActive: false, commandRunning: false, supported: false };
        const STUB_FILTER = { exeNames: [], bypass: false, seenExes: [], runningProcesses: [] };

        window.harSuite = {
          // Data
          getAll: () => api('/api/requests').then(d => d.requests || []),
          clear: () => api('/api/requests', { method: 'DELETE' }).then(() => true),
          getStatus: () => api('/api/status'),
          setAllowlist: (domains) => api('/api/allowlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domains }) }),
          setCapture: (enabled) => api('/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled }) }),
          setScope: (scope) => api('/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scope }) }),
          setRedaction: (cfg) => api('/api/redaction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config: cfg }) }),
          regenerateToken: () => api('/api/token/regenerate', { method: 'POST' }).then(d => d.token),
          // App capture (desktop only)
          setAppCapture: stub({ ok: false, error: 'Not available in web mode' }),
          getAppCaptureStatus: stub(STUB_APP),
          // CLI (desktop only)
          runCommand: stub({ ok: false, error: 'Not available in web mode' }),
          cancelCommand: stub(false),
          setGlobalEnv: stub({ ok: false, error: 'Not available in web mode' }),
          getCliStatus: stub(STUB_CLI),
          getAppFilter: stub(STUB_FILTER),
          setAppFilter: stub(false),
          // Export
          exportData: (fmt) => api('/api/export?format=' + fmt),
          importHar: stub({ ok: false, error: 'Not available in web mode' }),
          toCurl: (id) => api('/api/requests/' + id + '/to-curl'),
          toFetch: (id) => api('/api/requests/' + id + '/to-fetch'),
          copyUrl: (id) => api('/api/requests/' + id + '/copy-url'),
          // Captchas
          getCaptchas: () => api('/api/captchas').then(d => d.captchas || []),
          clearCaptchas: () => api('/api/captchas', { method: 'DELETE' }).then(() => true),
          copySitekey: stub(null),
          // Sessions
          listSessions: () => api('/api/sessions').then(d => d.sessions || []),
          currentSession: () => api('/api/sessions/current').then(d => d.sessionId),
          newSession: (name) => api('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }).then(d => d.id),
          openSession: (id) => api('/api/sessions/' + id + '/open', { method: 'POST' }).then(d => d.sessionId),
          deleteSession: (id) => api('/api/sessions/' + id, { method: 'DELETE' }).then(() => true),
          renameSession: (id, name) => api('/api/sessions/' + id + '/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }).then(() => true),
          // Event listeners
          onRequest: (cb) => { on('capture:request', cb); return () => off('capture:request', cb); },
          onUpdate: (cb) => { const h = (p) => cb(p.id, p.patch); on('capture:update', h); return () => off('capture:update', h); },
          onWsMessage: (cb) => { const h = (p) => cb(p.id, p.message); on('capture:ws-message', h); return () => off('capture:ws-message', h); },
          onStatus: (cb) => { on('capture:status', cb); return () => off('capture:status', cb); },
          onAppCaptureStatus: (cb) => { on('capture:app-status', cb); return () => off('capture:app-status', cb); },
          onCliStatus: (cb) => { on('capture:cli-status', cb); return () => off('capture:cli-status', cb); },
          onCommandOutput: (cb) => { on('capture:command-output', cb); return () => off('capture:command-output', cb); },
          onConnection: (cb) => { on('capture:connection', cb); return () => off('capture:connection', cb); },
          onCleared: (cb) => { on('capture:cleared', cb); return () => off('capture:cleared', cb); },
          onReloaded: (cb) => { on('capture:reloaded', cb); return () => off('capture:reloaded', cb); },
          onCaptcha: (cb) => { on('capture:captcha', cb); return () => off('capture:captcha', cb); },
          onAppFilterChanged: (cb) => { on('capture:app-filter-changed', cb); return () => off('capture:app-filter-changed', cb); },
          getCookies: () => api('/api/cookies').then(d => d.cookies || []),
          exportCookies: () => api('/api/cookies/export'),
          clearCookies: () => api('/api/cookies', { method: 'DELETE' }).then(() => true),
          onCookie: (cb) => { on('capture:cookie', cb); return () => off('capture:cookie', cb); },
        };
      })();
    </script>
    <script type="module" crossorigin src="/assets/index.web-CAtRgvFS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B5p_5POX.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="health-chip" style="position:fixed;left:12px;bottom:12px;z-index:99999;background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:999px;padding:8px 12px;font:12px/1.3 ui-sans-serif,system-ui;max-width:70vw">health…</div>
    <div id="req-panel" style="position:fixed;left:12px;bottom:56px;z-index:99999;width:min(420px,94vw);max-height:40vh;overflow:auto;background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);font:12px/1.4 ui-sans-serif,system-ui">
      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #374151;position:sticky;top:0;background:#111827">
        <strong>Requests</strong>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button id="rp-refresh" style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">Refresh</button>
          <button id="rp-zip" style="background:#059669;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">ZIP</button>
          <button id="rp-har" style="background:#0d9488;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">HAR</button>
          <button id="rp-hide" style="background:#374151;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">Hide</button>
        </div>
      </div>
      <div style="padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #1f2937">
        <input id="rp-host" placeholder="host" style="flex:1;min-width:80px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
        <input id="rp-method" placeholder="method" style="width:70px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
        <input id="rp-status" placeholder="status" style="width:60px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
        <input id="rp-type" placeholder="type" style="width:70px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
        <input id="rp-q" placeholder="search" style="flex:1;min-width:80px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
      </div>
      <div id="rp-meta" style="padding:8px 12px;color:#9ca3af"></div>
      <pre id="rp-list" style="margin:0;padding:0 12px 12px;white-space:pre-wrap;word-break:break-all"></pre>
    </div>
    <button id="rp-show" style="display:none;position:fixed;left:12px;bottom:56px;z-index:99999;background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:999px;padding:10px 14px;cursor:pointer">Requests</button>
    <div id="cookie-panel" style="position:fixed;right:12px;bottom:12px;z-index:99999;width:min(460px,94vw);max-height:55vh;overflow:auto;background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);font:12px/1.4 ui-sans-serif,system-ui">
      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #374151;position:sticky;top:0;background:#111827">
        <strong>Cookies</strong>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button id="cp-refresh" style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">Refresh</button>
          <button id="cp-export-json" style="background:#059669;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">JSON</button>
          <button id="cp-export-header" style="background:#0d9488;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">Header</button>
          <button id="cp-export-txt" style="background:#7c3aed;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">cookies.txt</button>
          <button id="cp-clear" style="background:#7f1d1d;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">Clear</button>
          <button id="cp-hide" style="background:#374151;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">Hide</button>
        </div>
      </div>
      <div style="padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #1f2937">
        <input id="cp-host" placeholder="host filter" style="flex:1;min-width:110px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
        <input id="cp-name" placeholder="name filter (xs)" style="flex:1;min-width:110px;background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 8px"/>
        <label style="display:flex;align-items:center;gap:4px;color:#9ca3af"><input id="cp-httponly" type="checkbox"/> HttpOnly</label>
      </div>
      <div id="cp-meta" style="padding:8px 12px;color:#9ca3af"></div>
      <pre id="cp-list" style="margin:0;padding:0 12px 12px;white-space:pre-wrap;word-break:break-all"></pre>
    </div>
    <button id="cp-show" style="display:none;position:fixed;right:12px;bottom:12px;z-index:99999;background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:999px;padding:10px 14px;cursor:pointer">Cookies</button>
    <script>
      (function(){
        const panel=document.getElementById('cookie-panel');
        const list=document.getElementById('cp-list');
        const meta=document.getElementById('cp-meta');
        const showBtn=document.getElementById('cp-show');
        const health=document.getElementById('health-chip');
        const hostEl=document.getElementById('cp-host');
        const nameEl=document.getElementById('cp-name');
        const httpOnlyEl=document.getElementById('cp-httponly');
        function qs(){
          const p=new URLSearchParams();
          p.set('limit','300');
          if(hostEl.value.trim()) p.set('host', hostEl.value.trim());
          if(nameEl.value.trim()) p.set('name', nameEl.value.trim());
          if(httpOnlyEl.checked) p.set('httpOnly','1');
          return p.toString();
        }
        async function refreshHealth(){
          try{
            const h=await fetch('/api/health').then(r=>r.json());
            const age=h.lastCookieAt? Math.round((Date.now()-h.lastCookieAt)/1000)+'s':'—';
            health.textContent = (h.ok?'OK':'DOWN')
              + ' · ' + (h.backend||'?')
              + ' · redis ' + (h.redisOk?'on':'off')
              + ' · ext ' + (h.extensionConnected?'on':'off')
              + ' · last cookie ' + age;
            health.style.borderColor = h.ok ? '#065f46' : '#7f1d1d';
          }catch(e){ health.textContent='health failed'; }
        }
        async function refresh(){
          try{
            const d=await fetch('/api/cookies?'+qs()).then(r=>r.json());
            const rows=d.cookies||[];
            meta.textContent = rows.length + ' cookies · session ' + (d.sessionId||'?') + ' · ' + (d.backend||'') + (d.redis?' · redis':'');
            list.textContent = rows.slice(0,150).map(c => `${c.host||''}  ${c.name}=${String(c.value||'').slice(0,80)}${c.httpOnly?'  [HttpOnly]':''}`).join('\n') || '(empty)';
          }catch(e){ meta.textContent='failed: '+e.message; }
        }
        function download(name, text, type){
          const blob=new Blob([text],{type:type||'text/plain'});
          const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
        }
        document.getElementById('cp-refresh').onclick=refresh;
        document.getElementById('cp-export-json').onclick=async()=>{
          const d=await fetch('/api/cookies/export?format=latest&'+qs().replace('limit=300','')).then(r=>r.json());
          download('cookies-export.json', JSON.stringify(d,null,2), 'application/json');
        };
        document.getElementById('cp-export-header').onclick=async()=>{
          const d=await fetch('/api/cookies/export?format=header&'+qs().replace('limit=300','')).then(r=>r.json());
          download('cookie-header.txt', d.cookieHeader || Object.entries(d.headersByHost||{}).map(([h,v])=>h+'\n'+v).join('\n\n'));
        };
        document.getElementById('cp-export-txt').onclick=async()=>{
          const txt=await fetch('/api/cookies/export?format=netscape&'+qs().replace('limit=300','')).then(r=>r.text());
          download('cookies.txt', txt);
        };
        document.getElementById('cp-clear').onclick=async()=>{ await fetch('/api/cookies',{method:'DELETE'}); refresh(); };
        document.getElementById('cp-hide').onclick=()=>{ panel.style.display='none'; showBtn.style.display='block'; };
        showBtn.onclick=()=>{ panel.style.display='block'; showBtn.style.display='none'; refresh(); };
        hostEl.oninput=nameEl.oninput=()=>{ clearTimeout(window.__cpf); window.__cpf=setTimeout(refresh,250); };
        httpOnlyEl.onchange=refresh;
        try{
          const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
          ws.onmessage=(e)=>{ try{ const m=JSON.parse(e.data); if(m.type==='cookie-snapshot'||m.type==='set-cookie-capture'||m.type==='request') { refresh(); refreshHealth(); } }catch{} };
        }catch{}
        setTimeout(()=>{ refresh(); refreshHealth(); }, 500);
        setInterval(refresh, 10000);
        setInterval(refreshHealth, 5000);

        // Requests filter panel
        const rp=document.getElementById('req-panel');
        const rpShow=document.getElementById('rp-show');
        const rpList=document.getElementById('rp-list');
        const rpMeta=document.getElementById('rp-meta');
        function rqs(){
          const p=new URLSearchParams();
          p.set('limit','100');
          ['host','method','status','type','q'].forEach((k)=>{
            const el=document.getElementById('rp-'+k);
            if(el && el.value.trim()) p.set(k==='q'? 'q' : k, el.value.trim());
          });
          return p.toString();
        }
        async function refreshReqs(){
          try{
            const d=await fetch('/api/requests?'+rqs()).then(r=>r.json());
            const rows=d.requests||[];
            rpMeta.textContent = (d.total||rows.length) + ' requests';
            rpList.textContent = rows.slice(0,80).map(r => `${r.status||'-'} ${r.method||''} ${r.type||''} ${r.host||''} ${r.url||''}`).join('\n') || '(empty)';
          }catch(e){ rpMeta.textContent='failed: '+e.message; }
        }
        document.getElementById('rp-refresh').onclick=refreshReqs;
        document.getElementById('rp-hide').onclick=()=>{ rp.style.display='none'; rpShow.style.display='block'; };
        rpShow.onclick=()=>{ rp.style.display='block'; rpShow.style.display='none'; refreshReqs(); };
        ['rp-host','rp-method','rp-status','rp-type','rp-q'].forEach(id=>{
          const el=document.getElementById(id); if(el) el.oninput=()=>{ clearTimeout(window.__rpf); window.__rpf=setTimeout(refreshReqs,250); };
        });
        document.getElementById('rp-har').onclick=()=>{ location.href='/api/export/har'; };
        document.getElementById('rp-zip').onclick=()=>{ location.href='/api/export/zip'; };
        setTimeout(refreshReqs, 700);
        setInterval(refreshReqs, 12000);
      })();
    </script>
  </body>
</html>
